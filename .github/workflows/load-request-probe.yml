name: Diagnostic load-request probe regression
on:
  push:
    paths:
      - 'skse64/TextureRelease*'
      - 'tests/texture_release/**'
      - 'skse64/Hooks_SaveLoad.cpp'
      - 'skse64/GameData.h'
      - 'skse64/LoadPluginSnapshot.h'
      - 'skse64/LoadAdmissionRuntime.*'
      - 'skse64/LoadStreamLifetime.*'
      - 'tests/load_stream_lifetime/**'
      - 'skse64/AdmittedSnapshot.h'
      - 'skse64/Serialization.*'
      - 'tests/admitted_snapshot/**'
      - 'skse64/PapyrusMemberGuard.*'
      - 'tests/papyrus_member_guard/**'
      - 'tests/load_admission_lifecycle/**'
      - 'tests/plugin_snapshot/**'
      - 'tests/load_request_probe/**'
      - '.github/workflows/load-request-probe.yml'
  pull_request:
    paths:
      - 'skse64/TextureRelease*'
      - 'tests/texture_release/**'
      - 'skse64/Hooks_SaveLoad.cpp'
      - 'skse64/GameData.h'
      - 'skse64/LoadPluginSnapshot.h'
      - 'skse64/LoadAdmissionRuntime.*'
      - 'skse64/LoadStreamLifetime.*'
      - 'tests/load_stream_lifetime/**'
      - 'skse64/AdmittedSnapshot.h'
      - 'skse64/Serialization.*'
      - 'tests/admitted_snapshot/**'
      - 'skse64/PapyrusMemberGuard.*'
      - 'tests/papyrus_member_guard/**'
      - 'tests/load_admission_lifecycle/**'
      - 'tests/plugin_snapshot/**'
      - 'tests/load_request_probe/**'
      - '.github/workflows/load-request-probe.yml'
permissions:
  contents: read
jobs:
  regression:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: cmake -S tests/load_request_probe -B build-load-request-probe
      - run: cmake --build build-load-request-probe --config Release
      - run: ctest --test-dir build-load-request-probe -C Release --output-on-failure
      - run: cmake -S tests/plugin_snapshot -B build-plugin-snapshot
      - run: cmake --build build-plugin-snapshot --config Release
      - run: ctest --test-dir build-plugin-snapshot -C Release --output-on-failure
      - run: cmake -S tests/load_admission_lifecycle -B build-admission-lifecycle
      - run: cmake --build build-admission-lifecycle --config Release
      - run: ctest --test-dir build-admission-lifecycle -C Release --output-on-failure
      - run: cmake -S tests/load_stream_lifetime -B build-stream-lifetime
      - run: cmake --build build-stream-lifetime --config Release
      - run: ctest --test-dir build-stream-lifetime -C Release --output-on-failure
      - run: cmake -S tests/admitted_snapshot -B build-admitted-snapshot
      - run: cmake --build build-admitted-snapshot --config Release
      - run: ctest --test-dir build-admitted-snapshot -C Release --output-on-failure
      - run: cmake -S tests/papyrus_member_guard -B build-member-guard
      - run: cmake --build build-member-guard --config Release
      - run: ctest --test-dir build-member-guard -C Release --output-on-failure
      - run: cmake -S tests/texture_release -B build-texture-release
      - run: cmake --build build-texture-release --config Release
      - run: ctest --test-dir build-texture-release -C Release --output-on-failure
