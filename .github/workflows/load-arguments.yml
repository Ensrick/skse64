name: Load argument regression
on:
  push:
    paths:
      - 'skse64/Hooks_SaveLoad.cpp'
      - 'skse64/GameData.h'
      - 'tests/load_arguments/**'
      - '.github/workflows/load-arguments.yml'
  pull_request:
    paths:
      - 'skse64/Hooks_SaveLoad.cpp'
      - 'skse64/GameData.h'
      - 'tests/load_arguments/**'
      - '.github/workflows/load-arguments.yml'
permissions:
  contents: read
jobs:
  regression:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: cmake -S tests/load_arguments -B build-load-arguments
      - run: cmake --build build-load-arguments --config Release
      - run: ctest --test-dir build-load-arguments -C Release --output-on-failure
